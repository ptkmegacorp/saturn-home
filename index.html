<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saturn</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { max-width: 52rem; margin: 2rem auto; padding: 0 1.25rem;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; line-height: 1.55; color: #1a1a1a;
      background: #fff; }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; vertical-align: top; }
    blockquote { border-left: 3px solid #c9c9c9; margin: 1rem 0; padding: 0.25rem 1rem; color: #444; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
    pre { background: #f4f4f5; padding: 1rem; overflow-x: auto; border-radius: 6px; }
    a { color: #0969da; }
    h1 { border-bottom: 1px solid #eaeaea; padding-bottom: 0.35rem; }
  </style>
</head>
<body>
  <div id="content">Loading…</div>
  <script>
    fetch("./README.md")
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then((md) => {
        md = md.replace(/\]\(docs\/images\//g, "](images/");
        document.getElementById("content").innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById("content").textContent = "Could not load README.md.";
      });
  </script>
</body>
</html>
